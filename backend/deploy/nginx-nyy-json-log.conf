log_format nyy_json escape=json '{'
  '"time":"$time_iso8601",'
  '"host":"$host",'
  '"request_id":"$request_id",'
  '"client_ip":"$remote_addr",'
  '"method":"$request_method",'
  '"uri":"$uri",'
  '"status":$status,'
  '"request_time":"$request_time",'
  '"upstream_time":"$upstream_response_time",'
  '"user_agent":"$http_user_agent",'
  '"referer":"$http_referer",'
  '"sec_fetch_site":"$http_sec_fetch_site",'
  '"sec_fetch_mode":"$http_sec_fetch_mode",'
  '"sec_fetch_dest":"$http_sec_fetch_dest",'
  '"sec_fetch_user":"$http_sec_fetch_user"'
'}';

map $host $nyy_json_loggable {
  default 0;
  nyy.app 1;
  www.nyy.app 1;
}

access_log /var/log/nginx/nyy_access.json nyy_json if=$nyy_json_loggable;
