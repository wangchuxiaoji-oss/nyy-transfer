name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nyy
          POSTGRES_PASSWORD: nyy
          POSTGRES_DB: nyy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyy -d nyy_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: dev
      APP_BASE_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql+asyncpg://nyy:nyy@127.0.0.1:5432/nyy_test
      DATABASE_SYNC_URL: postgresql+psycopg://nyy:nyy@127.0.0.1:5432/nyy_test
      TEST_DATABASE_URL: postgresql+asyncpg://nyy:nyy@127.0.0.1:5432/nyy_test
      TEST_DATABASE_SYNC_URL: postgresql+psycopg://nyy:nyy@127.0.0.1:5432/nyy_test
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: ci-secret-key-change-me-32-bytes-minimum
      JWT_SECRET: ci-jwt-secret-change-me-32-bytes-minimum
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run Playwright e2e
        env:
          PLAYWRIGHT_WEB_SERVER: "1"
          PLAYWRIGHT_WEB_SERVER_COMMAND: npm run start
        run: npx playwright test

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore

  player-smoke:
    name: Player Smoke
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    env:
      SMOKE_FASTSTART_URL: ${{ secrets.SMOKE_FASTSTART_URL }}
      SMOKE_FASTSTART_EXPECT_NAME: ${{ secrets.SMOKE_FASTSTART_EXPECT_NAME }}
      SMOKE_AC3_URL: ${{ secrets.SMOKE_AC3_URL }}
      SMOKE_AC3_EXPECT_NAME: ${{ secrets.SMOKE_AC3_EXPECT_NAME }}
      SMOKE_MKV_NATIVE_URL: ${{ secrets.SMOKE_MKV_NATIVE_URL }}
      SMOKE_MKV_NATIVE_EXPECT_NAME: ${{ secrets.SMOKE_MKV_NATIVE_EXPECT_NAME }}
      SMOKE_CODEC_MATRIX_URL: ${{ secrets.SMOKE_CODEC_MATRIX_URL }}
      SMOKE_CODEC_MATRIX_API_URL: ${{ secrets.SMOKE_CODEC_MATRIX_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Faststart smoke
        run: |
          if [ -z "$SMOKE_FASTSTART_URL" ]; then
            echo "SMOKE_FASTSTART_URL 未配置，跳过 faststart smoke。"
            exit 0
          fi
          SHARE_TEST_URL="$SMOKE_FASTSTART_URL" \
          SHARE_EXPECT_NAME="${SMOKE_FASTSTART_EXPECT_NAME:-星际穿越}" \
          npm run smoke:share-faststart

      - name: AC-3 smoke
        run: |
          if [ -z "$SMOKE_AC3_URL" ]; then
            echo "SMOKE_AC3_URL 未配置，跳过 AC-3 smoke。"
            exit 0
          fi
          SHARE_TEST_URL="$SMOKE_AC3_URL" \
          SHARE_EXPECT_NAME="${SMOKE_AC3_EXPECT_NAME:-信条}" \
          npm run smoke:share-ac3

      - name: MKV native smoke
        run: |
          if [ -z "$SMOKE_MKV_NATIVE_URL" ]; then
            echo "SMOKE_MKV_NATIVE_URL 未配置，跳过 MKV native smoke。"
            exit 0
          fi
          SHARE_TEST_URL="$SMOKE_MKV_NATIVE_URL" \
          SHARE_EXPECT_NAME="${SMOKE_MKV_NATIVE_EXPECT_NAME:-TEAM-053.mkv}" \
          npm run smoke:share-mkv-native

      - name: Codec matrix smoke
        run: |
          if [ -z "$SMOKE_CODEC_MATRIX_URL" ]; then
            echo "SMOKE_CODEC_MATRIX_URL 未配置，跳过 codec matrix smoke。"
            exit 0
          fi
          if [ -n "$SMOKE_CODEC_MATRIX_API_URL" ]; then
            export SHARE_API_URL="$SMOKE_CODEC_MATRIX_API_URL"
          fi
          SHARE_TEST_URL="$SMOKE_CODEC_MATRIX_URL" \
          SHARE_CODEC_REPORT="$RUNNER_TEMP/codec-matrix-smoke-report.json" \
          npm run smoke:share-codec-matrix

      - name: Upload codec matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codec-matrix-smoke-report
          path: ${{ runner.temp }}/codec-matrix-smoke-report.json
          if-no-files-found: ignore
